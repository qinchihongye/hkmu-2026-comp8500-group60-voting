[project]
name = "voting-backend"
version = "0.1.0"
description = "COMP8500SEF group 60 voting API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "openai>=3.40.0",
    "psycopg[binary]>=3",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
